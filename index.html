<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MTR US Addon</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    </head>

    <body>
        <header>
            <nav>
                <div class="logo">
                    <img src="logo.png" alt="MTR US Addon logo">
                    <span>MTR US Addon</span>
                </div>

                <ul>
                    <li><a href="#features">Features</a></li>
                    <li><a href="#gallery">Gallery</a></li>
                </ul>
            </nav>
        </header>

        <section class="hero">
            <div>
                <h1>MTR US Addon</h1>

                <p>A large expansion to Minecraft Transit Railway, focused on United States rail.</p>

                <div class="buttons">
                    <a class="btn primary" href="https://modrinth.com/mod/mtr-us-addon"><i class="fa-solid fa-download"></i> Download</a>
                    <a class="btn secondary" href="https://github.com/EJD799/MTR-US-Addon"><i class="fa-brands fa-github"></i> GitHub</a>
                </div>
            </div>

            <div class="hero-image"></div>
        </section>

        <section id="features" class="reveal">
            <h2>Gallery</h2>

            <div class="gallery">
                <div class="image">
                    <img src="images/screenshot1.jpg" alt="">
                </div>

                <div class="image">
                    <img src="images/screenshot2.jpg" alt="">
                </div>

                <div class="image">
                    <img src="images/screenshot3.jpg" alt="">
                </div>
            </div>
        </section>

        <footer>Website created by @PtaterTot and @EJD799</footer>

        <script>
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("show");
                    }
                });
            }, {threshold: 0.15});

            document.querySelectorAll(".reveal").forEach(e => observer.observe(e));
        </script>
    </body>
</html>
